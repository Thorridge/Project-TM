<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware Manager | Accueil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="home.html"><i class="bi bi-cpu"></i> HardwarePark</a>

            <div class="navbar-text mx-auto text-white-50 d-none d-lg-block">
                Connecté en tant que : <span id="userNom" class="text-white fw-bold">...</span>
            </div>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse flex-grow-0" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="home.html">Accueil</a></li>
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Tableau de bord</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Mes Prêts</a></li>
                    <li class="nav-item"><a class="btn btn-outline-light ms-lg-2" href="index.html">Déconnexion</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="hero-section text-center">
        <div class="container">
            <h1 class="display-6">Gestion du Matériel Informatique</h1>
            <p class="lead">Labo de tests & Association</p>

            <div class="row justify-content-center mt-4">
                <div class="col-md-8">
                    <div class="input-group mb-3">
                        <input type="text" id="searchName" class="form-control"
                            placeholder="Nom de l'objet (ex: Switch 24 ports)...">
                        <select id="searchCategory" class="form-select" style="max-width: 170px;">
                            <option value="">Toutes catégories</option>
                        </select>
                        <button class="btn btn-primary" type="button" id="btnSearch">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container my-5">

        <!-- STATS -->
        <div class="row mb-4">
            <div class="col-6 col-md-3">
                <div class="card card-stats shadow-sm p-3 mb-2">
                    <small class="text-muted">Total Objets</small>
                    <div class="h4 mb-0" id="statTotal">
                        <div class="spinner-border spinner-border-sm text-primary"></div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card card-stats shadow-sm p-3 mb-2 border-warning">
                    <small class="text-muted">En Prêt</small>
                    <div class="h4 mb-0 text-warning" id="statPret">
                        <div class="spinner-border spinner-border-sm text-warning"></div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card card-stats shadow-sm p-3 mb-2 border-danger">
                    <small class="text-muted">Maintenance</small>
                    <div class="h4 mb-0 text-danger" id="statMaintenance">
                        <div class="spinner-border spinner-border-sm text-danger"></div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card card-stats shadow-sm p-3 mb-2 border-success">
                    <small class="text-muted">Disponibles</small>
                    <div class="h4 mb-0 text-success" id="statDispo">
                        <div class="spinner-border spinner-border-sm text-success"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- RÉSULTATS RECHERCHE -->
        <div id="searchResults" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4 mt-2" style="display:none !important;"></div>

    </main>

    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container text-center">
            <small>&copy; 2026 - Projet Technologies Mobiles - Gestion de Parc Hardware</small>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    $(document).ready(function () {

        // ── 1. Charger les stats ───────────────────────────────────
        $.ajax({
            url: '../backend/get_stats.php',
            method: 'GET',
            dataType: 'json',
            success: function (data) {
                $('#statTotal').text(data.total);
                $('#statPret').text(data.pret);
                $('#statMaintenance').text(data.maintenance);
                $('#statDispo').text(data.disponible);
            },
            error: function () {
                $('#statTotal, #statPret, #statMaintenance, #statDispo').text('-');
            }
        });

        // ── 2. Charger les catégories ──────────────────────────────
        $.ajax({
            url: '../backend/get_categories.php',
            method: 'GET',
            dataType: 'json',
            success: function (cats) {
                cats.forEach(function (c) {
                    $('#searchCategory').append(
                        `<option value="${c.idCategorie}">${c.nom}</option>`
                    );
                });
            }
        });

        // ── 3. Recherche depuis home ───────────────────────────────
        function doSearch() {
            const nom = $('#searchName').val().trim();
            const cat = $('#searchCategory').val();

            if (!nom && !cat) {
                $('#searchResults').hide();
                return;
            }

            $('#btnSearch').html('<span class="spinner-border spinner-border-sm"></span>');

            $.ajax({
                url: '../backend/get_objets.php',
                method: 'GET',
                data: { nom: nom, cat: cat },
                dataType: 'json',
                success: function (objets) {
                    $('#btnSearch').html('<i class="bi bi-search"></i>');

                    if (objets.length === 0) {
                        $('#searchResults').html('<div class="col"><p class="text-white text-center">Aucun objet trouvé.</p></div>').show();
                        return;
                    }

                    let html = '';
                    objets.forEach(function (o) {
                        const badgeClass = o.statut === 'Disponible' ? 'bg-success' :
                                           o.statut.includes('Prêt') ? 'bg-warning text-dark' :
                                                                        'bg-danger';
                        html += `
                        <div class="col">
                            <div class="card h-100 product-card shadow-sm">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-start mb-2">
                                        <h5 class="card-title h6 mb-0">${o.nom}</h5>
                                        <span class="badge ${badgeClass}">${o.statut}</span>
                                    </div>
                                    <p class="card-text text-muted small mb-1">
                                        <i class="bi bi-tag me-1"></i>${o.categorie}
                                    </p>
                                    <p class="card-text text-primary small">
                                        <i class="bi bi-geo-alt me-1"></i>
                                        ${o.site_nom} › ${o.local_nom} › ${o.rangement_nom} › ${o.niveau_nom}
                                    </p>
                                </div>
                            </div>
                        </div>`;
                    });
                    $('#searchResults').html(html).show();
                }
            });
        }

        $('#btnSearch').on('click', doSearch);
        $('#searchName').on('keypress', function (e) {
            if (e.which === 13) doSearch();
        });

    });
    </script>
</body>
</html>
