<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HardwarePark | Mes Prêts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="home.html"><i class="bi bi-cpu"></i> HardwarePark</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="home.html">Accueil</a></li>
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Tableau de bord</a></li>
                    <li class="nav-item"><a class="nav-link active" href="prets.html">Mes Prêts</a></li>
                    <li class="nav-item"><a class="btn btn-outline-light ms-lg-2" href="index.html">Déconnexion</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="h4 mb-0"><i class="bi bi-arrow-left-right me-2"></i>Gestion des Prêts</h2>
        </div>

        <!-- TABLEAU DES PRÊTS -->
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <i class="bi bi-list-check me-2"></i> Prêts en cours
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Objet</th>
                                <th>Catégorie</th>
                                <th>Emprunté par</th>
                                <th>Date début</th>
                                <th>Retour prévu</th>
                                <th>Statut</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="pretsList">
                            <tr>
                                <td colspan="7" class="text-center py-4">
                                    <div class="spinner-border text-primary"></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container text-center">
            <small>&copy; 2026 - Projet Technologies Mobiles - Gestion de Parc Hardware</small>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    $(document).ready(function () {

        function loadPrets() {
            $.ajax({
                url: '../backend/get_prets.php',
                method: 'GET',
                dataType: 'json',
                success: function (prets) {
                    if (prets.length === 0) {
                        $('#pretsList').html('<tr><td colspan="7" class="text-center text-muted py-4">Aucun prêt en cours.</td></tr>');
                        return;
                    }

                    let html = '';
                    prets.forEach(function (p) {
                        const dateDebut  = new Date(p.date_debut).toLocaleDateString('fr-FR');
                        const dateRetour = p.date_retour_prevue ? new Date(p.date_retour_prevue).toLocaleDateString('fr-FR') : '-';
                        const retourne   = p.date_retour_reelle !== null;

                        // Vérifier si en retard
                        const today = new Date();
                        const prevue = new Date(p.date_retour_prevue);
                        const enRetard = !retourne && prevue < today;

                        const statutBadge = retourne
                            ? `<span class="badge bg-success">Retourné</span>`
                            : enRetard
                                ? `<span class="badge bg-danger">En retard</span>`
                                : `<span class="badge bg-warning text-dark">En cours</span>`;

                        const actionBtn = retourne
                            ? `<span class="text-muted small">-</span>`
                            : `<button class="btn btn-sm btn-outline-success btn-retour" data-id="${p.idPret}">
                                <i class="bi bi-check-circle me-1"></i>Retour
                               </button>`;

                        html += `
                        <tr>
                            <td>
                                <strong>${p.objet_nom}</strong>
                                <br><small class="text-muted">${p.site_nom} › ${p.local_nom}</small>
                            </td>
                            <td><span class="badge bg-secondary">${p.categorie}</span></td>
                            <td>
                                ${p.prenomUtilisateur} ${p.nomUtilisateur}
                                <br><small class="text-muted">${p.login}</small>
                            </td>
                            <td>${dateDebut}</td>
                            <td class="${enRetard ? 'text-danger fw-bold' : ''}">${dateRetour}</td>
                            <td>${statutBadge}</td>
                            <td>${actionBtn}</td>
                        </tr>`;
                    });

                    $('#pretsList').html(html);
                },
                error: function () {
                    $('#pretsList').html('<tr><td colspan="7" class="text-center text-danger py-4">Erreur lors du chargement.</td></tr>');
                }
            });
        }

        // Chargement initial
        loadPrets();

        // Bouton retour
        $(document).on('click', '.btn-retour', function () {
            const idPret = $(this).data('id');
            const btn = $(this);

            btn.prop('disabled', true).html('<span class="spinner-border spinner-border-sm"></span>');

            $.ajax({
                url: '../backend/retour_pret.php',
                method: 'POST',
                data: { idPret: idPret },
                dataType: 'json',
                success: function (response) {
                    if (response.success) {
                        loadPrets(); // Recharger la liste
                    }
                }
            });
        });

    });
    </script>
</body>
</html>
