        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse flex-grow-0" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item d-lg-none">
                    <span class="nav-link disabled text-info">
                        Utilisateur : <b id="userPseudoMobile">...</b>
                    </span>

<!-- CONTENU -->
<div class="container my-4">

    <h4 class="mb-3">Gestion des prêts</h4>

    <!-- FILTRES -->
    <div class="row mb-3 align-items-end">

        <div class="col-md-4 mb-2">
            <input type="text" id="searchUser" class="form-control" placeholder="Rechercher utilisateur...">
        </div>

        <div class="col-md-3 mb-2">
            <select id="filterStatus" class="form-select">
                <option value="">Tous les états</option>
                <option value="en_cours">En cours</option>
                <option value="termine">Terminé</option>
            </select>
        </div>

        <div class="col-md-2 mb-2">
            <button class="btn btn-primary w-100 h-100 d-flex justify-content-center align-items-center" id="btnSearch">
                <i class="bi bi-search me-1"></i> Rechercher
            </button>
        </div>

        <div class="col-md-3 mb-2">
            <a href="addpret.html" class="btn btn-success w-100 h-100 d-flex justify-content-center align-items-center">
                <i class="bi bi-plus-lg me-1"></i> Ajouter un prêt
            </a>
        </div>
    </div>

    <!-- LISTE -->
    <div id="loanList" class="row">
        <div class="text-center text-muted py-5">
            Chargement des prêts...
        </div>
    </div>

</div>

<!-- FOOTER -->
<footer class="bg-dark text-white py-4 mt-auto">
    <div class="container text-center">
        <small>&copy; 2026 - Projet Technologies Mobiles - Gestion de Parc Hardware</small>
    </div>
</footer>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>

// 🔹 Badge statut
function getStatusBadge(statut) {
    if (statut === "en_cours") return `<span class="badge bg-warning text-dark">En cours</span>`;
    if (statut === "termine") return `<span class="badge bg-success">Terminé</span>`;
    return `<span class="badge bg-secondary">Inconnu</span>`;
}

// 🔹 ACTION retour (fusion du 1er fichier)
function retourPret(idPret, idObjet) {

    if (!confirm("Confirmer la réception ?")) return;

    fetch("../backend/retour_pret.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ idPret: idPret, idObjet: idObjet })
    })
    .then(res => res.json())
    .then(res => {
        if (res.success) {
            loadLoans(); 
        } else {
            alert(res.message);
        }
    });
}

// 🔹 Render
function renderLoans(loans) {

    let html = "";

    loans.forEach(l => {

        let btn = "";

        if (l.statut === "en_cours") {
            btn = `
            <button class="btn btn-sm btn-success mt-2"
                onclick="retourPret(${l.idPret}, ${l.idObjet})">
                <i class="bi bi-box-arrow-in-down"></i>
                Réceptionner
            </button>`;
        }

        html += `
        <div class="col-md-6 col-lg-4 mb-3">
            <div class="card loan-card p-3 shadow-sm">

                <h6>${l.produit}</h6>

                <small class="text-muted">
                    Utilisateur : ${l.user}
                </small><br>

                <small class="text-muted">
                    Date : ${l.date}
                </small>

                <div class="mt-2">
                    ${getStatusBadge(l.statut)}
                </div>

                ${btn}

            </div>
        </div>
        `;
    });

    document.getElementById("loanList").innerHTML = html;
}

// 🔹 LOAD
function loadLoans(params = "") {
    console.log("Tentative de chargement avec :", params); // Debug 1

    fetch("../backend/get_pret.php" + params)
        .then(res => {
            console.log("Statut réponse HTTP:", res.status); // Debug 2
            return res.json();
        })
        .then(data => {
            console.log("Données reçues du PHP :", data); // Debug 3
            renderLoans(data);
        })
        .catch(err => {
            console.error("Erreur Fetch :", err);
            $("#loanList").html("<div class='text-danger text-center'>Erreur de chargement</div>");
        });
}

// 🔹 SEARCH
$("#btnSearch").on("click", function () {
    let user = $("#searchUser").val();
    let status = $("#filterStatus").val();
    loadLoans(`?user=${user}&status=${status}`);
});

// INIT
$(document).ready(function () {
    loadLoans();
});

</script>

</body>
</html>
