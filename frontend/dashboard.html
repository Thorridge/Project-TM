<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de Bord | HardwarePark</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">

    <style>
        /* Surlignage emplacement sélectionné */
        .selected-location {
            background-color: rgba(13, 110, 253, 0.15) !important;
            border-left: 3px solid #0d6efd;
            font-weight: 600;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="home.html"><i class="bi bi-cpu"></i> HardwarePark</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="home.html">Accueil</a></li>
                    <li class="nav-item"><a class="nav-link nav-dashboard" href="dashboard.html">Tableau de bord</a></li>
                    <li class="nav-item"><a class="nav-link nav-loans" href="prets.html">Mes Prêts</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container-fluid my-4 px-lg-5">
        <div class="row">

            <!-- SIDEBAR ARBORESCENCE -->
            <aside class="col-lg-3 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <i class="bi bi-diagram-3 me-2"></i> Emplacements
                    </div>

                    <div class="card-body p-0">

                        <!-- Bouton reset -->
                        <div class="p-2">
                            <button id="resetFilters" class="btn btn-sm btn-outline-secondary w-100">
                                <i class="bi bi-arrow-counterclockwise me-1"></i> Tous les objets
                            </button>
                        </div>

                        <div class="list-group list-group-flush" id="treeview">
                            <div class="text-center py-3 text-muted small">
                                <div class="spinner-border spinner-border-sm"></div> Chargement...
                            </div>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- CONTENU PRINCIPAL -->
            <section class="col-lg-9">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="h4 mb-0 text-dark">Inventaire du matériel</h2>
                    <a href="addproduct.html" class="btn btn-primary shadow-sm">
                        <i class="bi bi-plus-lg me-2"></i>Ajouter un objet
                    </a>
                </div>

                <!-- FORMULAIRE RECHERCHE -->
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-5">
                                <label class="form-label small fw-bold">Recherche par nom</label>
                                <input type="text" id="filterName" class="form-control" placeholder="Ex: Switch Cisco...">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">Catégorie</label>
                                <select id="filterCategory" class="form-select">
                                    <option value="">Toutes les catégories</option>
                                </select>
                            </div>
                            <div class="col-md-3 d-flex align-items-end">
                                <button id="btnSearch" class="btn btn-outline-primary w-100">
                                    <i class="bi bi-search me-2"></i> Filtrer
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- LISTE OBJETS -->
                <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4" id="objectList">
                    <div class="col text-center py-5 text-muted">
                        <div class="spinner-border text-primary"></div>
                        <p class="mt-2">Chargement des objets...</p>
                    </div>
                </div>

            </section>
        </div>
    </main>
    <!-- MODAL APERCU IMAGE -->
    <div class="modal fade" id="imgModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content bg-dark">
          <div class="modal-body p-0 text-center">
            <img id="modalImg" src="" class="img-fluid" style="max-height:90vh; object-fit:contain;">
          </div>
          <div class="modal-footer border-0 justify-content-center">
            <button class="btn btn-light" data-bs-dismiss="modal">Fermer</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container text-center">
            <small>&copy; 2026 - Projet Technologies Mobiles - Gestion de Parc Hardware</small>
        </div>
    </footer>
    
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>

    <script>
    checkSession(function(data) {
        const role = (data.user_role || '').toLowerCase();
        if (role === 'user') {
            document.body.innerHTML = "";
            window.location.href = "home.html";
        }
    });
    </script>

    <script>
    $(document).ready(function () {

        // filtres courants
        let currentNom = '';
        let currentCat = '';
        let currentLocal = '';
        let currentRangement = '';

        // ── 1. Charger les catégories ──────────────────────────────
        $.ajax({
            url: '../backend/get_categories.php',
            method: 'GET',
            dataType: 'json',
            success: function (cats) {
                cats.forEach(function (c) {
                    $('#filterCategory').append(
                        `<option value="${c.idCategorie}">${c.nom}</option>`
                    );
                });
            }
        });

        // ── 2. Charger l'arborescence ──────────────────────────────
        $.ajax({
            url: '../backend/get_tree.php',
            method: 'GET',
            dataType: 'json',
            success: function (tree) {
                let html = '';
                if (tree.length === 0) {
                    html = '<p class="text-muted small p-3">Aucun emplacement trouvé.</p>';
                } else {
                    tree.forEach(function (site, i) {
                        html += `
                        <div class="list-group-item p-2">
                            <div class="d-flex justify-content-between align-items-center"
                                 data-bs-toggle="collapse" data-bs-target="#site${i}"
                                 style="cursor:pointer;">
                                <span><i class="bi bi-building me-2 text-primary"></i><strong>${site.nom}</strong></span>
                                <i class="bi bi-chevron-down small"></i>
                            </div>
                            <div class="collapse show ms-3 mt-1" id="site${i}">`;

                        site.locaux.forEach(function (local) {
                            html += `
                                <div>
                                    <a href="#" class="list-group-item list-group-item-action border-0 py-1 small filter-local"
                                       data-local="${local.idLocal}">
                                        <i class="bi bi-door-open me-1"></i> ${local.nom}
                                    </a>`;

                            if (local.rangements && local.rangements.length > 0) {
                                local.rangements.forEach(function (r) {
                                    html += `
                                        <a href="#" class="list-group-item list-group-item-action border-0 py-1 ms-3 small filter-rangement"
                                           data-rangement="${r.idRangement}">
                                            <i class="bi bi-archive me-1"></i> ${r.nom}
                                        </a>`;
                                });
                            }
                            html += `</div>`;
                        });

                        html += `</div></div>`;
                    });
                }
                $('#treeview').html(html);
            }
        });

        // ── 3. Charger les objets ──────────────────────────────────
        function loadObjets(nom = '', cat = '', idLocal = '', idRangement = '') {

            currentNom = nom;
            currentCat = cat;
            currentLocal = idLocal;
            currentRangement = idRangement;

            $('#objectList').html('<div class="col text-center py-5 text-muted"><div class="spinner-border text-primary"></div><p class="mt-2">Chargement...</p></div>');

            $.ajax({
                url: '../backend/get_objets.php',
                method: 'GET',
                data: { nom: nom, cat: cat, local: idLocal, rangement: idRangement },
                dataType: 'json',
                success: function (objets) {
                    if (objets.length === 0) {
                        $('#objectList').html('<div class="col"><p class="text-muted text-center py-4">Aucun objet trouvé.</p></div>');
                        return;
                    }

                    let html = '';
                    objets.forEach(function (o) {

                        const badgeClass =
                            o.statut === 'Disponible' ? 'bg-success' :
                            o.statut === 'Prêté'      ? 'bg-warning text-dark' :
                                                        'bg-danger';

                        html += `
                        <div class="col">
                            <div class="card h-100 product-card shadow-sm">

                                <!-- IMAGE -->
                                <div class="text-center p-2 img-click"
                                     data-img="${o.photo ? `../backend/uploads/objets/${o.photo}` : ''}"
                                     style="height:160px; display:flex; align-items:center; justify-content:center; cursor:pointer;">

                                    ${
                                        o.photo
                                        ? `<img src="../backend/uploads/objets/${o.photo}" 
                                                 class="img-fluid"
                                                 style="max-height:150px; object-fit:contain;">`
                                        : `<i class="bi bi-image text-secondary" style="font-size:4rem;"></i>`
                                    }
                                </div>

                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-start mb-2">
                                        <h5 class="card-title h6 mb-0">${o.nom}</h5>
                                        <span class="badge ${badgeClass}">${o.statut}</span>
                                    </div>

                                    <p class="card-text text-muted small mb-1">
                                        <i class="bi bi-tag me-1"></i>${o.categorie}
                                    </p>

                                    <p class="card-text text-primary small">
                                        <i class="bi bi-geo-alt me-1"></i>
                                        ${o.site_nom} › ${o.local_nom} › ${o.rangement_nom} › ${o.niveau_nom}
                                    </p>

                                    ${o.infoPlus ? `<p class="card-text small text-muted">${o.infoPlus}</p>` : ''}
                                </div>

                                <div class="card-footer bg-transparent border-top-0">
                                    <div class="d-flex gap-2">
                                        <a href="edit_objet.html?id=${o.idObjet}" class="btn btn-sm btn-outline-warning flex-fill">
                                            <i class="bi bi-pencil me-1"></i>Modifier
                                        </a>
                                        <button class="btn btn-sm btn-outline-danger flex-fill btn-delete" 
                                                data-id="${o.idObjet}" data-nom="${o.nom}">
                                            <i class="bi bi-trash me-1"></i>Supprimer
                                        </button>
                                    </div>
                                </div>

                            </div>
                        </div>`;
                    });

                    $('#objectList').html(html);
                },
                error: function () {
                    $('#objectList').html('<div class="col"><p class="text-danger text-center py-4">Erreur lors du chargement.</p></div>');
                }
            });
        }

        // Chargement initial
        loadObjets();
        // ── 4. Bouton recherche ────────────────────────────────────
        $('#btnSearch').on('click', function () {
            loadObjets($('#filterName').val(), $('#filterCategory').val(), currentLocal, currentRangement);
        });

        $('#filterName').on('keypress', function (e) {
            if (e.which === 13) $('#btnSearch').click();
        });

        // ── 5. Filtrer par local ───────────────────────────────────
        $(document).on('click', '.filter-local', function (e) {
            e.preventDefault();

            // surlignage
            $('.filter-local, .filter-rangement').removeClass('selected-location');
            $(this).addClass('selected-location');

            const idLocal = $(this).data('local');
            loadObjets($('#filterName').val(), $('#filterCategory').val(), idLocal, '');
        });

        // ── 6. Filtrer par rangement ───────────────────────────────
        $(document).on('click', '.filter-rangement', function (e) {
            e.preventDefault();

            // surlignage
            $('.filter-local, .filter-rangement').removeClass('selected-location');
            $(this).addClass('selected-location');

            const idRangement = $(this).data('rangement');
            loadObjets($('#filterName').val(), $('#filterCategory').val(), '', idRangement);
        });

        // ── 7. Réinitialiser tous les filtres ──────────────────────
        $(document).on('click', '#resetFilters', function () {

            // retirer surlignage
            $('.filter-local, .filter-rangement').removeClass('selected-location');

            // vider les champs
            $('#filterName').val('');
            $('#filterCategory').val('');

            // reset internes
            currentNom = '';
            currentCat = '';
            currentLocal = '';
            currentRangement = '';

            // recharger tout
            loadObjets();
        });

        // ── 8. Supprimer un objet ─────────────────────────────────
        $(document).on('click', '.btn-delete', function () {
            const idObjet = $(this).data('id');
            const nom = $(this).data('nom');

            if (!confirm('Supprimer "' + nom + '" ? Cette action est irréversible.')) return;

            const btn = $(this);
            btn.prop('disabled', true).html('<span class="spinner-border spinner-border-sm"></span>');

            $.ajax({
                url: '../backend/delete_objet.php',
                method: 'POST',
                data: { idObjet: idObjet },
                dataType: 'json',
                success: function (response) {
                    if (response.success) {
                        loadObjets(currentNom, currentCat, currentLocal, currentRangement);
                    } else {
                        alert('Erreur lors de la suppression.');
                        btn.prop('disabled', false).html('<i class="bi bi-trash me-1"></i>Supprimer');
                    }
                },
                error: function () {
                    alert('Erreur lors de la suppression.');
                    btn.prop('disabled', false).html('<i class="bi bi-trash me-1"></i>Supprimer');
                }
            });
        });

        // ── 9. Aperçu image dans modal ─────────────────────────────
        $(document).on('click', '.img-click', function () {
            const src = $(this).data('img');
            if (!src) return;

            $('#modalImg').attr('src', src);
            const modal = new bootstrap.Modal(document.getElementById('imgModal'));
            modal.show();
        });

    });
    </script>

</body>
</html>
