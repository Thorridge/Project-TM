    <link rel="stylesheet" href="style.css">

    <style>

            line-height: 1.2;
        }

<body class="d-flex flex-column min-vh-100">

<!-- NAV (inchangé) -->

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="home.html">Accueil</a></li>
                <li class="nav-item"><a class="nav-link active" href="dashboard.html">Tableau de bord</a></li>
                <li class="nav-item"><a class="btn btn-outline-light ms-lg-2" href="index.html">Déconnexion</a></li>
            </ul>
        </div>

</nav>

<!-- HEADER CATEGORIES (inchangé visuellement) -->
<div class="bg-white border-bottom shadow-sm">
    <div class="container py-2">
        <ul class="nav nav-pills" id="categoryTabs">
            <li class="nav-item">
                <a class="nav-link active" href="#" data-cat="">Tous</a>
            </li>
            <li class="nav-item"><a class="nav-link" href="#" data-cat="1">Informatique</a></li>
            <li class="nav-item"><a class="nav-link" href="#" data-cat="2">Réseau</a></li>
            <li class="nav-item"><a class="nav-link" href="#" data-cat="3">Outillage</a></li>
        </ul>
    </div>
</div>

<main class="container-fluid my-4 px-lg-5">
    <div class="row">

        <!-- SIDEBAR -->
        <aside class="col-lg-3 mb-4">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <i class="bi bi-diagram-3 me-2"></i> Emplacements
                </div>
                <div class="card-body p-3 small text-muted">
                    <i class="bi bi-info-circle"></i> Filtrage backend à venir
                </div>
            </div>
        </aside>

        <!-- MAIN -->
        <section class="col-lg-9">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="h4 mb-0">Inventaire du matériel</h2>

                <a href="addproduct.html" class="btn btn-primary">
                    <i class="bi bi-plus-lg me-2"></i>Ajouter un objet
                </a>
            </div>

            <!-- SEARCH -->
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <form class="row g-3" id="searchForm">

                        <div class="col-md-5">
                            <input type="text" id="filterName" class="form-control"
                                placeholder="Rechercher un objet...">
                        </div>

                        <div class="col-md-4">
                            <select id="filterCategory" class="form-select">
                                <option value="">Toutes les catégories</option>
                            </select>
                        </div>

                        <div class="col-md-3">
                            <button class="btn btn-outline-primary w-100" type="submit">

                    </form>
                </div>
            </div>

            <!-- OBJECTS -->
            <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4" id="objectList">
                <div class="text-center text-muted py-5">
                    Chargement...
                </div>
            </div>

        </section>
    </div>
</main>

<footer class="bg-dark text-white py-4 mt-auto">
    <div class="container text-center">
        <small>&copy; 2026 - HardwarePark</small>
    </div>
</footer>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>

function badge(statut) {
    if (statut === "Disponible") return "bg-success";
    if (statut === "En prêt") return "bg-warning text-dark";
    if (statut === "Maintenance") return "bg-danger";
    return "bg-secondary";
}

// 🔥 RENDER
function renderObjects(data) {

    let html = "";

    data.forEach(obj => {

        let info = obj.emprunteur
            ? `<div class="text-warning small">
                    <i class="bi bi-person"></i> ${obj.emprunteur}
               </div>`
            : `<div class="text-success small">
                    <i class="bi bi-geo-alt"></i> ${obj.emplacement}
               </div>`;

        html += `
        <div class="col item-card">
            <div class="card h-100 shadow-sm">

                <div class="card-body d-flex flex-column">

                    <h5 class="h6">${obj.nom}</h5>

                    <p class="text-muted small mb-1">
                        ${obj.categorie}
                    </p>

                    <p class="small text-muted">
                        ${obj.infoPlus ?? "Aucune description"}
                    </p>

                    <div class="mt-auto">
                        ${info}
                    </div>

                    <span class="badge ${badge(obj.statut)} mt-2">
                        ${obj.statut}
                    </span>

                </div>
            </div>
        </div>
        `;
    });

    $("#objectList").html(html);
}

// 🔥 LOAD DATA
function loadObjects(params = "") {

    fetch("backend/objets.php" + params)
        .then(r => r.json())
        .then(data => renderObjects(data))
        .catch(() => {
            $("#objectList").html(
                "<div class='text-danger text-center'>Erreur chargement</div>"
            );
        });
}

// 🔥 SEARCH
$("#searchForm").on("submit", function (e) {
    e.preventDefault();

    const name = $("#filterName").val();
    const cat = $("#filterCategory").val();

    loadObjects(`?search=${name}&cat=${cat}`);
});

// 🔥 CATEGORY TABS (frontend simple)
$("#categoryTabs a").on("click", function (e) {
    e.preventDefault();

    $("#categoryTabs a").removeClass("active");
    $(this).addClass("active");

    const cat = $(this).data("cat");
    loadObjects(`?cat=${cat}`);
});

// INIT
$(document).ready(function () {
    loadObjects();
});

</script>

</body>
</html>
