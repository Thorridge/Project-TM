<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware Manager | Ajouter un objet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">
            <i class="bi bi-cpu"></i> HardwarePark
        </span>
    </div>
</nav>

<!-- CONTENU -->
<div class="container my-5">

    <div class="card form-card">
        
        <div class="form-header">
            <h5 class="mb-0"><i class="bi bi-plus-circle"></i> Ajouter un objet</h5>
        </div>

        <div class="card-body">

            <form id="formAddProduct">

                <!-- Nom -->
                <div class="mb-3">
                    <label class="form-label">Nom de l'objet</label>
                    <input type="text" id="nom" class="form-control" placeholder="Ex: Switch Cisco 24 ports">
                </div>

                <!-- Catégorie -->
                <div class="mb-3">
                    <label class="form-label">Catégorie</label>
                    <select id="categorie" class="form-select">
                        <option value="">Choisir une catégorie</option>
                        <option>Réseau</option>
                        <option>Serveur</option>
                        <option>Périphérique</option>
                        <option>Stockage</option>
                    </select>
                </div>

                <!-- État -->
                <div class="mb-3">
                    <label class="form-label">État</label>
                    <select id="etat" class="form-select">
                        <option value="disponible">Disponible</option>
                        <option value="pret">En prêt</option>
                        <option value="maintenance">Maintenance</option>
                    </select>
                </div>

                <!-- Localisation -->
                <div class="mb-3">
                    <label class="form-label">Localisation</label>
                    <input type="text" id="localisation" class="form-control" placeholder="Ex: Salle serveur">
                </div>

                <!-- Description -->
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea id="description" class="form-control" rows="3"></textarea>
                </div>

                <!-- Boutons -->
                <div class="d-flex justify-content-between">
                    <a href="home.html" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Retour
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i> Ajouter
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
// prêt pour AJAX plus tard
document.getElementById("formAddProduct").addEventListener("submit", function(e) {
    e.preventDefault();

    const data = {
        nom: document.getElementById("nom").value,
        categorie: document.getElementById("categorie").value,
        etat: document.getElementById("etat").value,
        localisation: document.getElementById("localisation").value,
        description: document.getElementById("description").value
    };

    console.log("Données à envoyer :", data);

    // FUTUR :
    // fetch('api/addProduct.php', { ... })
});
</script>

</body>
</html>
