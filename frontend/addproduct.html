<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware Manager | Ajouter un objet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="home.html">
            <i class="bi bi-cpu"></i> HardwarePark
        </a>
    </div>
</nav>

<!-- CONTENU -->
<div class="container my-5">
    <div class="card form-card">

        <div class="form-header">
            <h5 class="mb-0"><i class="bi bi-plus-circle"></i> Ajouter un objet</h5>
        </div>

        <div class="card-body">

            <!-- Message retour global -->
            <div id="message" class="mb-3" style="display:none;"></div>

            <!-- Nom -->
            <div class="mb-3">
                <label class="form-label">Nom de l'objet <span class="text-danger">*</span></label>
                <input type="text" id="nom" class="form-control" placeholder="Ex: Switch Cisco 24 ports">
            </div>

            <!-- Catégorie -->
            <div class="mb-3">
                <label class="form-label">Catégorie <span class="text-danger">*</span></label>
                <select id="idCategorie" class="form-select">
                    <option value="">Choisir une catégorie</option>
                </select>
            </div>

            <!-- Emplacement -->
            <div class="mb-3">
                <label class="form-label">Emplacement <span class="text-danger">*</span></label>
                <select id="idNiveau" class="form-select">
                    <option value="">Choisir un emplacement</option>
                </select>
            </div>

            <!-- Statut -->
            <div class="mb-3">
                <label class="form-label">Statut <span class="text-danger">*</span></label>
                <select id="idStatut" class="form-select">
                    <option value="">Choisir un statut</option>
                </select>
            </div>

            <!-- Info rangement -->
            <div class="mb-3">
                <label class="form-label">Info rangement</label>
                <input type="text" id="infoRangement" class="form-control" placeholder="Ex: Face avant, Étagère gauche...">
            </div>

            <!-- Description -->
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea id="infoPlus" class="form-control" rows="3" placeholder="Infos supplémentaires..."></textarea>
            </div>

            <!-- Propriétaire -->
            <div class="mb-3">
                <label class="form-label">ID Propriétaire <span class="text-danger">*</span></label>
                <input type="number" id="FK_idUser" class="form-control" placeholder="Ex: 4" min="1">
                <small class="text-muted">Entrez l'ID de l'utilisateur propriétaire</small>
            </div>

            <!-- Image -->
            <div class="mb-3">
                <label class="form-label">Photo de l'objet</label>
                <input type="file" id="photo" class="form-control" accept="image/*">

                <!-- Message erreur image -->
                <small id="photoError" class="text-danger mt-1" style="display:none;"></small>

                <!-- Preview -->
                <img id="preview" src="" class="img-fluid mt-2" style="max-height: 200px; display:none; border-radius:6px;">
            </div>

            <!-- Boutons -->
            <div class="d-flex justify-content-between">
                <a href="dashboard.html" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Retour
                </a>
                <button id="btnAdd" class="btn btn-primary">
                    <i class="bi bi-check-circle"></i> Ajouter
                </button>
            </div>

        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="auth.js"></script>

<script>
checkSession(function(data) {
    const role = (data.user_role || '').toLowerCase();
    if (role === 'user') {
        document.body.innerHTML = "";
        window.location.href = "home.html";
    }
});
</script>

<script>
$(document).ready(function () {

    const MAX_FILE_SIZE = 2 * 1024 * 1024; // 2 Mo

    // Preview image
    $("#photo").on("change", function () {
        $('#photoError').hide().text('');

        const file = this.files[0];
        if (!file) return;

        if (file.size > MAX_FILE_SIZE) {
            $('#photoError').text("L'image est trop lourde. Taille maximale : 2 Mo.").show();
            $("#preview").hide();
            return;
        }

        const reader = new FileReader();
        reader.onload = function (e) {
            $("#preview").attr("src", e.target.result).show();
        };
        reader.readAsDataURL(file);
    });

    // Charger catégories
    $.ajax({
        url: '../backend/get_categories.php',
        method: 'GET',
        dataType: 'json',
        success: function (cats) {
            cats.forEach(c => {
                $('#idCategorie').append(`<option value="${c.idCategorie}">${c.nom}</option>`);
            });
        }
    });

    // Charger niveaux
    $.ajax({
        url: '../backend/get_niveaux.php',
        method: 'GET',
        dataType: 'json',
        success: function (niveaux) {
            niveaux.forEach(n => {
                $('#idNiveau').append(`<option value="${n.idNiveau}">${n.label}</option>`);
            });
        }
    });

    // Charger statuts
    $.ajax({
        url: '../backend/get_statuts.php',
        method: 'GET',
        dataType: 'json',
        success: function (statuts) {
            statuts.forEach(s => {
                $('#idStatut').append(`<option value="${s.idStatut}">${s.libelle}</option>`);
            });
        }
    });

    // Ajouter l'objet
    $('#btnAdd').on('click', function () {

        const msg = $('#message');
        msg.hide();

        const nom           = $('#nom').val().trim();
        const idCategorie   = $('#idCategorie').val();
        const idNiveau      = $('#idNiveau').val();
        const idStatut      = $('#idStatut').val();
        const infoPlus      = $('#infoPlus').val().trim();
        const infoRangement = $('#infoRangement').val().trim();
        const FK_idUser     = $('#FK_idUser').val().trim();
        const photo         = $('#photo')[0].files[0];

        // Champs obligatoires
        if (!nom || !idCategorie || !idNiveau || !idStatut || !FK_idUser) {
            msg.removeClass().addClass('alert alert-danger')
               .text('Veuillez remplir tous les champs obligatoires (*)').show();
            return;
        }

        // Taille image
        $('#photoError').hide().text('');
        if (photo && photo.size > MAX_FILE_SIZE) {
            $('#photoError').text("L'image est trop lourde. Taille maximale : 2 Mo.").show();
            return;
        }

        const formData = new FormData();
        formData.append("nom", nom);
        formData.append("idCategorie", idCategorie);
        formData.append("idNiveau", idNiveau);
        formData.append("idStatut", idStatut);
        formData.append("infoPlus", infoPlus);
        formData.append("infoRangement", infoRangement);
        formData.append("FK_idUser", FK_idUser);

        if (photo) formData.append("photo", photo);

        $('#btnAdd').prop('disabled', true)
                    .html('<span class="spinner-border spinner-border-sm"></span> Ajout...');

        $.ajax({
            url: '../backend/add_objet.php',
            method: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            dataType: 'json',
            success: function (response) {
                if (response.success) {
                    msg.removeClass().addClass('alert alert-success')
                       .text('Objet ajouté ! Redirection...').show();
                    setTimeout(() => window.location.href = 'dashboard.html', 1500);
                } else {
                    msg.removeClass().addClass('alert alert-danger')
                       .text(response.message).show();
                    $('#btnAdd').prop('disabled', false)
                                .html('<i class="bi bi-check-circle"></i> Ajouter');
                }
            },
            error: function () {
                msg.removeClass().addClass('alert alert-danger')
                   .text('Erreur serveur. Réessayez.').show();
                $('#btnAdd').prop('disabled', false)
                            .html('<i class="bi bi-check-circle"></i> Ajouter');
            }
        });
    });

});
</script>

</body>
</html>
