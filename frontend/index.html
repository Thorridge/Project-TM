<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>HardwarePark | Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-4 shadow" style="width: 400px;">
            <h4 class="text-center mb-4">HardwarePark</h4>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Login</label>
                    <input type="text" id="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Se connecter</button>
                <div id="message" class="mt-3 text-center"></div>
                <div class="text-center mt-2"><a href="inscription.html">Pas de compte ? S'inscrire</a></div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const msg = document.getElementById("message");
            const formData = new FormData();
            formData.append('action', 'login');
            formData.append('login', document.getElementById("username").value);
            formData.append('mdp', document.getElementById("password").value);

            fetch('process.php', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    // Ici on a récupéré le pseudo et le rôle
                    console.log("Bienvenue " + data.user.pseudo);
                    msg.innerHTML = "<span class='text-success'>Connexion réussie !</span>";
                    window.location.href = "home.html"; // Redirection vers l'accueil
                } else {
                    msg.innerHTML = `<span class='text-danger'>${data.error}</span>`;
                }
            });
        });
    </script>
</body>
</html>
