<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hardware Manager | Connexion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card login-card">
        <div class="login-header">
            <h4><i class="bi bi-cpu"></i> HardwarePark</h4>
            <small>Gestion du matériel informatique</small>
        </div>
        <div class="login-body">
            <div class="mb-3">
                <label for="username" class="form-label">Nom d'utilisateur</label>
                <input type="text" id="username" class="form-control" placeholder="Email ou nom d'utilisateur">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label" >Mot de passe</label>
                <input type="password" id="password" class="form-control" placeholder="Inserer votre mot de passe">
            </div>
            <button class="btn btn-primary w-100 mb-2">
                <i class="bi bi-box-arrow-in-right"></i> Se connecter
            </button>
            <div class="text-center">
                <a href="#" class="text-decoration-none">S'inscrire</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
