<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hardware Manager | Inscription</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">
    
    <div class="card register-card">
        
        <div class="register-header">
            <h4><i class="bi bi-cpu"></i> HardwarePark</h4>
            <small>Créer un compte</small>
        </div>

        <div class="card-body">

            <form id="registerForm">

                <!-- Username -->
                <div class="mb-3">
                    <label class="form-label">Nom d'utilisateur</label>
                    <input type="text" id="username" class="form-control" placeholder="ex: admin123">
                </div>

                <!-- Email (optionnel mais pro) -->
                <div class="mb-3">
                    <label class="form-label">Pseudo</label>
                    <input type="text" id="pseudo" class="form-control" placeholder="ex: roardu95">
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••">
                </div>

                <!-- Confirm Password -->
                <div class="mb-3">
                    <label class="form-label">Confirmer le mot de passe</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••">
                </div>

                <!-- Bouton -->
                <button type="submit" class="btn btn-primary w-100 mb-2">
                    <i class="bi bi-person-plus"></i> S'inscrire
                </button>

                <!-- Lien login -->
                <div class="text-center">
                    <small>Déjà un compte ? 
                        <a href="index.html" class="text-decoration-none">Se connecter</a>
                    </small>
                </div>

                <!-- Message -->
                <div id="message" class="text-center mt-2"></div>

            </form>

        </div>

    </div>

</div>

<script>

// Validation frontend (important pour UX)
document.getElementById("registerForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let username = document.getElementById("username").value;
    let pseudo = document.getElementById("pseudo").value;
    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("confirmPassword").value;

    let message = document.getElementById("message");

    if (!username || !password) {
        message.innerHTML = "<span class='text-danger'>Champs obligatoires</span>";
        return;
    }

    if (password !== confirmPassword) {
        message.innerHTML = "<span class='text-danger'>Les mots de passe ne correspondent pas</span>";
        return;
    }

    message.innerHTML = "<span class='text-success'>Prêt à envoyer (API à connecter)</span>";

    // FUTUR :
    // fetch('api/register.php', { ... })
});
</script>

</body>
</html>
