<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hardware Manager | Inscription</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card register-card">

        <div class="register-header">
            <h4><i class="bi bi-cpu"></i> HardwarePark</h4>
            <small>Créer un compte</small>
        </div>

        <div class="card-body">

            <!-- Nom -->
            <div class="mb-3">
                <label class="form-label">Nom <span class="text-danger">*</span></label>
                <input type="text" id="nom" class="form-control" placeholder="Votre nom">
            </div>

            <!-- Prénom -->
            <div class="mb-3">
                <label class="form-label">Prénom <span class="text-danger">*</span></label>
                <input type="text" id="prenom" class="form-control" placeholder="Votre prénom">
            </div>

            <!-- Pseudo -->
            <div class="mb-3">
                <label class="form-label">Pseudo</label>
                <input type="text" id="pseudo" class="form-control" placeholder="ex: roardu95">
            </div>

            <!-- Login -->
            <div class="mb-3">
                <label class="form-label">Login <span class="text-danger">*</span></label>
                <input type="text" id="login" class="form-control" placeholder="Votre identifiant de connexion">
            </div>

            <!-- Mot de passe -->
            <div class="mb-3">
                <label class="form-label">Mot de passe <span class="text-danger">*</span></label>
                <input type="password" id="password" class="form-control" placeholder="Min. 6 caractères">
            </div>

            <!-- Confirmer mot de passe -->
            <div class="mb-3">
                <label class="form-label">Confirmer le mot de passe <span class="text-danger">*</span></label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Répétez votre mot de passe">
            </div>

            <!-- Message retour -->
            <div id="message" class="text-center mb-2 small" style="display:none;"></div>

            <!-- Bouton -->
            <button id="btnRegister" class="btn btn-primary w-100 mb-2">
                <i class="bi bi-person-plus"></i> S'inscrire
            </button>

            <!-- Lien login -->
            <div class="text-center">
                <small>Déjà un compte ?
                    <a href="index.html" class="text-decoration-none">Se connecter</a>
                </small>
            </div>

        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
$(document).ready(function () {

    $('#btnRegister').on('click', function () {

        const nom           = $('#nom').val().trim();
        const prenom        = $('#prenom').val().trim();
        const pseudo        = $('#pseudo').val().trim();
        const login         = $('#login').val().trim();
        const mdp           = $('#password').val().trim();
        const mdpConf       = $('#confirmPassword').val().trim();
        const msg           = $('#message');

        // Validation côté client
        if (!nom || !prenom || !login || !mdp || !mdpConf) {
            msg.removeClass('text-success').addClass('text-danger')
               .text('Veuillez remplir tous les champs obligatoires (*)').show();
            return;
        }

        if (mdp !== mdpConf) {
            msg.removeClass('text-success').addClass('text-danger')
               .text('Les mots de passe ne correspondent pas.').show();
            return;
        }

        if (mdp.length < 6) {
            msg.removeClass('text-success').addClass('text-danger')
               .text('Le mot de passe doit faire au moins 6 caractères.').show();
            return;
        }

        // Désactiver le bouton
        $('#btnRegister').prop('disabled', true)
                         .html('<span class="spinner-border spinner-border-sm"></span> Inscription...');

        // Appel AJAX
        $.ajax({
            url: '../backend/register.php',
            method: 'POST',
            data: { nom, prenom, pseudo, login, mdp, mdpConf },
            dataType: 'json',
            success: function (response) {
                if (response.success) {
                    msg.removeClass('text-danger').addClass('text-success')
                       .text('Compte créé ! Redirection vers la connexion...').show();
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    msg.removeClass('text-success').addClass('text-danger')
                       .text(response.message).show();
                    $('#btnRegister').prop('disabled', false)
                                     .html('<i class="bi bi-person-plus"></i> S\'inscrire');
                }
            },
            error: function () {
                msg.removeClass('text-success').addClass('text-danger')
                   .text('Erreur serveur. Réessayez.').show();
                $('#btnRegister').prop('disabled', false)
                                 .html('<i class="bi bi-person-plus"></i> S\'inscrire');
            }
        });
    });

});
</script>

</body>
</html>
