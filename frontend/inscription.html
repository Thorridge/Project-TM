<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>HardwarePark | Inscription</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-4 shadow" style="width: 400px;">
            <h4 class="text-center mb-4">Créer un compte</h4>
            <form id="registerForm">
                <div class="mb-3">
                    <label class="form-label">Nom d'utilisateur (Login)</label>
                    <input type="text" id="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Pseudo</label>
                    <input type="text" id="pseudo" class="form-control" placeholder="Votre pseudo (facultatif)">
                </div>
                <div class="mb-3">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100">S'inscrire</button>
                <div id="message" class="mt-3 text-center"></div>
                <div class="text-center mt-2"><a href="index.html">Déjà inscrit ? Connexion</a></div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById("registerForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const msg = document.getElementById("message");
            const formData = new FormData();
            formData.append('action', 'register');
            formData.append('login', document.getElementById("username").value);
            formData.append('pseudo', document.getElementById("pseudo").value);
            formData.append('mdp', document.getElementById("password").value);

            fetch('process.php', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    msg.innerHTML = "<span class='text-success'>Compte créé ! Redirection...</span>";
                    setTimeout(() => window.location.href = "index.html", 1500);
                } else {
                    msg.innerHTML = `<span class='text-danger'>${data.error}</span>`;
                }
            });
        });
    </script>
</body>
</html>
