<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HardwarePark | Modifier un objet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="home.html">
            <i class="bi bi-cpu"></i> HardwarePark
        </a>
    </div>
</nav>

<div class="container my-5">
    <div class="card form-card">
        <div class="form-header">
            <h5 class="mb-0"><i class="bi bi-pencil-square"></i> Modifier un objet</h5>
        </div>
        <div class="card-body">

            <form id="editForm" enctype="multipart/form-data">

                <div id="message" class="mb-3" style="display:none;"></div>

                <input type="hidden" id="idObjet" name="idObjet">

                <div class="mb-3">
                    <label class="form-label">Nom de l'objet <span class="text-danger">*</span></label>
                    <input type="text" id="nom" name="nom" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Catégorie <span class="text-danger">*</span></label>
                    <select id="idCategorie" name="idCategorie" class="form-select">
                        <option value="">Choisir une catégorie</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Emplacement <span class="text-danger">*</span></label>
                    <select id="idNiveau" name="idNiveau" class="form-select">
                        <option value="">Choisir un emplacement</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Statut <span class="text-danger">*</span></label>
                    <select id="idStatut" name="idStatut" class="form-select">
                        <option value="">Choisir un statut</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Info rangement</label>
                    <input type="text" id="infoRangement" name="infoRangement" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea id="infoPlus" name="infoPlus" class="form-control" rows="3"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Image actuelle</label>
                    <div id="currentImage" class="mb-2"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Changer l'image</label>
                    <input type="file" id="photo" name="photo" class="form-control" accept="image/*">
                    <img id="preview" class="img-fluid mt-2" style="max-height:200px; display:none; border-radius:6px;">
                </div>

                <div class="d-flex justify-content-between">
                    <a href="dashboard.html" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Retour
                    </a>
                    <button id="btnEdit" type="button" class="btn btn-warning">
                        <i class="bi bi-save"></i> Enregistrer
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
$(document).ready(function () {

    const params = new URLSearchParams(window.location.search);
    const idObjet = params.get('id');

    if (!idObjet) {
        window.location.href = 'dashboard.html';
        return;
    }

    $("#photo").on("change", function () {
        const file = this.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = e => $("#preview").attr("src", e.target.result).show();
        reader.readAsDataURL(file);
    });

    $.when(
        $.ajax({ url: '../../backend/controllers/objets/get_categories.php', dataType: 'json' }),
        $.ajax({ url: '../../backend/controllers/objets/get_niveaux.php', dataType: 'json' }),
        $.ajax({ url: '../../backend/controllers/objets/get_statuts.php', dataType: 'json' }),
        $.ajax({ url: '../../backend/controllers/objets/get_one.php?id=' + idObjet, dataType: 'json' })
    ).done(function (cats, niveaux, statuts, objet) {

        cats[0].forEach(c => $('#idCategorie').append(`<option value="${c.idCategorie}">${c.nom}</option>`));
        niveaux[0].forEach(n => $('#idNiveau').append(`<option value="${n.idNiveau}">${n.label}</option>`));
        statuts[0].forEach(s => $('#idStatut').append(`<option value="${s.idStatut}">${s.libelle}</option>`));

        const o = objet[0];
        $('#idObjet').val(o.idObjet);
        $('#nom').val(o.nom);
        $('#idCategorie').val(o.idCategorie);
        $('#idNiveau').val(o.idNiveau);
        $('#idStatut').val(o.idStatut);
        $('#infoRangement').val(o.infoRangement);
        $('#infoPlus').val(o.infoPlus);

        if (o.photo) {
            $('#currentImage').html(`
                <img src="../assets/uploads/objets/${o.photo}" 
                     class="img-fluid" style="max-height:200px; object-fit:contain;">
            `);
        } else {
            $('#currentImage').html(`<p class="text-muted">Aucune image</p>`);
        }
    });

    $('#btnEdit').on('click', function () {
        const msg = $('#message');
        const formData = new FormData(document.getElementById("editForm"));

        $('#btnEdit').prop('disabled', true)
                     .html('<span class="spinner-border spinner-border-sm"></span> Enregistrement...');

        $.ajax({
            url: '../../backend/controllers/objets/edit.php',
            method: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            dataType: 'json',
            success: function (response) {
                if (response.success) {
                    msg.removeClass('alert-danger').addClass('alert alert-success')
                       .text('Modifications enregistrées ! Redirection...').show();
                    setTimeout(() => window.location.href = 'dashboard.html', 1500);
                } else {
                    msg.removeClass('alert-success').addClass('alert alert-danger')
                       .text(response.message).show();
                    $('#btnEdit').prop('disabled', false)
                                 .html('<i class="bi bi-save"></i> Enregistrer');
                }
            },
            error: function () {
                msg.removeClass('alert-success').addClass('alert alert-danger')
                   .text('Erreur serveur.').show();
                $('#btnEdit').prop('disabled', false)
                             .html('<i class="bi bi-save"></i> Enregistrer');
            }
        });
    });

});
</script>

<script>
window.addEventListener('pageshow', function (event) {
    if (event.persisted) window.location.reload();
});
</script>

</body>
</html>
