<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des utilisateurs</title>

    <!-- BOOTSTRAP + ICONS (CDN = aucun 404 possible) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 10px; }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- NAVBAR STYLE HOME -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">

            <!-- Logo -->
            <a class="navbar-brand" href="home.html">
                <i class="bi bi-cpu"></i> HardwarePark
            </a>

            <!-- Mobile -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Accueil + Déconnexion -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="home.html">Accueil</a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>

    <!-- PAGE -->
    <main class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h4">Gestion des utilisateurs</h1>
            <span class="badge bg-primary">OWNER</span>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">

                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Nom</th>
                            <th>Prénom</th>
                            <th>Login</th>
                            <th>Rôle</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>

                    <tbody id="usersTableBody">
                        <tr>
                            <td colspan="5" class="text-center text-muted">Chargement...</td>
                        </tr>
                    </tbody>
                </table>

            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="bg-dark text-white py-3 mt-auto">
        <div class="container text-center">
            <small>&copy; 2026 - Gestion de Parc Hardware</small>
        </div>
    </footer>

    <!-- JS CDN -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS INTÉGRÉ -->
    <script>

    $(document).ready(function () {

        loadUsers();

        // Boutons Promote / Rétrograder
        $(document).on('click', '.btn-set-role', function () {
            const id = $(this).data('id');
            const role = $(this).data('role');
            updateRole(id, role);
        });
    });

    /* ───────────────────────────────────────────────
       Charger les utilisateurs
    ─────────────────────────────────────────────── */
    function loadUsers() {

        $.get('../../backend/controllers/users/list_users.php', function (res) {

            if (!res.success) {
                $('#usersTableBody').html(`
                    <tr><td colspan="5" class="text-center text-danger">${res.message}</td></tr>
                `);
                return;
            }

            let html = '';

            res.users.forEach(u => {

                const badge =
                    u.role === 'owner' ? 'bg-dark' :
                    u.role === 'admin' ? 'bg-warning text-dark' :
                                        'bg-secondary';

                html += `
                    <tr>
                        <td>${u.nomUtilisateur}</td>
                        <td>${u.prenomUtilisateur}</td>
                        <td>${u.login}</td>
                        <td><span class="badge ${badge}">${u.role}</span></td>
                        <td class="text-end">${renderActions(u)}</td>
                    </tr>
                `;
            });

            $('#usersTableBody').html(html);
        }, 'json');
    }

    /* ───────────────────────────────────────────────
       Boutons Promote / Rétrograder
    ─────────────────────────────────────────────── */
    function renderActions(u) {

        if (u.role === 'owner') {
            return `<span class="text-muted small">Owner (non modifiable)</span>`;
        }

        if (u.role === 'user') {
            return `
                <button class="btn btn-sm btn-outline-warning btn-set-role"
                        data-id="${u.idUtilisateur}" data-role="admin">
                    <i class="bi bi-arrow-up-circle me-1"></i>Promouvoir admin
                </button>
            `;
        }

        if (u.role === 'admin') {
            return `
                <button class="btn btn-sm btn-outline-secondary btn-set-role"
                        data-id="${u.idUtilisateur}" data-role="user">
                    <i class="bi bi-arrow-down-circle me-1"></i>Rétrograder user
                </button>
            `;
        }

        return '';
    }

    /* ───────────────────────────────────────────────
       Mise à jour du rôle
    ─────────────────────────────────────────────── */
    function updateRole(idUtilisateur, role) {

        $.post('../../backend/users/update_role.php',
        { idUtilisateur, role },
        function (res) {

            if (!res.success) {
                alert(res.message);
                return;
            }

            loadUsers();
        }, 'json');
    }

    </script>

</body>
</html>
